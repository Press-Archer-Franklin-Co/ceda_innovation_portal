
server {
    listen 80;
    server_name innovation.ceda.co.bw;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name innovation.ceda.co.bw;

    # Reuse existing DigiCert EV cert — do NOT change these paths
    ssl_certificate     /usr/local/nginx/ceda.co.bw_2026.pem;
    ssl_certificate_key /usr/local/nginx/private.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;

    # Keep 100M from old config — new edge also accepts 20M internally,
    # but Nginx-level limit governs what reaches the container.
    client_max_body_size 100m;

    # Security headers
    proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Lax;";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options  nosniff always;
    add_header X-Frame-Options         SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; media-src 'self' blob:; frame-src 'self' blob:; worker-src blob:; object-src 'none'; frame-ancestors 'self'; form-action 'self'; base-uri 'self';" always;
    add_header Referrer-Policy         strict-origin-when-cross-origin always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # ------------------------------------------------------------------
    # Public portal
    # Old:  root /usr/local/nginx/dist; try_files $uri /index.html
    # New:  proxy → innovation_portal_edge:8080 (host port 18180)
    # ------------------------------------------------------------------
    location / {
        proxy_pass         http://127.0.0.1:18180;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------
    # Staff admin
    # New route — innovation_portal_edge:8081 (host port 18181)
    # ------------------------------------------------------------------
    location /staff/ {
        proxy_pass         http://127.0.0.1:18181/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------
    # /api/, /admin/, /static/, /media/, /health/ are handled INSIDE
    # the edge container's nginx (public.conf / staff.conf) and proxied
    # to innovation_portal_backend:8000 over the Docker network.
    # No direct proxy to port 18182 needed here.
    # ------------------------------------------------------------------

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}

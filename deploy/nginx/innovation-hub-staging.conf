server {
    listen 8443 ssl http2;
    server_name innovation.ceda.co.bw _;

    # Reuse the existing cert — no cert changes needed
    ssl_certificate     /usr/local/nginx/ceda.co.bw_2026.pem;
    ssl_certificate_key /usr/local/nginx/private.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 20m;

    # Public portal — innovation_portal_edge container (port 18180 → internal 8080)
    location / {
        proxy_pass         http://127.0.0.1:18180;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Staff admin — innovation_portal_edge container (port 18181 → internal 8081)
    location /staff/ {
        proxy_pass         http://127.0.0.1:18181/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

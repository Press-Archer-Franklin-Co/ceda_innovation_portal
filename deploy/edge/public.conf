server {
    listen 8080;
    server_name _;

    # Allow uploads up to 200 MB (covers videos, pitch decks, media uploads)
    client_max_body_size 200m;

    root /usr/share/nginx/html/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Staff console on the same origin as the public site (it is built with base /staff/
    # and sends people to <origin>/login to sign in). In production the host nginx sends
    # /staff/ to the staff server (port 18181) instead, so these blocks are not reached there.
    absolute_redirect off;

    location = /staff {
        return 301 /staff/;
    }

    location /staff/ {
        try_files $uri $uri/ /staff/index.html;
    }

    location = /staff/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location /api/ {
        proxy_pass http://innovation_portal_backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://innovation_portal_backend:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /docs/ {
        proxy_pass http://innovation_portal_backend:8000/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /health/ {
        proxy_pass http://innovation_portal_backend:8000/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Backend static & media — ^~ prevents regex locations from matching these paths
    location ^~ /static/ {
        alias /srv/backend-static/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Submission documents are private. They are never served by path; Django checks
    # access on /api/documents/<id>/download/ and hands the file to /protected-media/.
    location ^~ /media/submission_documents/ {
        return 404;
    }

    location ^~ /protected-media/ {
        internal;
        alias /srv/backend-media/;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /media/ {
        alias /srv/backend-media/;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    # Vite-hashed JS/CSS bundles — immutable, cache 1 year
    location ~* \.(js|css)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images and fonts from the frontend build — cache 30 days
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|otf)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }
}


name: CI

# Every push (main included), and pull requests to main that come from a fork.
# A pull request from a branch in this repository is not run again: the push run for the
# same commit already covers it (lanes test by pushing before a PR exists, see verify-work).
# Tests that already fail on main are listed in
# innovation_portal_api/tests/known_failures.txt and do not fail the run;
# any other failure does. Admin lint is compared with
# innovation_portal_admin/lint-baseline.json the same way.
on:
  push:
    branches-ignore:
      - ci-results
  pull_request:
    branches:
      - main

permissions:
  contents: read

# One run per branch and event: a new push makes the previous run pointless. The event is part
# of the group so the (skipped) pull_request run of a same-repo PR never cancels its push run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:

  em-dash:
    name: em-dash
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No new em dashes (plain-writing skill)
        run: |
          git fetch --no-tags origin main
          bash scripts/check_em_dash.sh origin/main

  old-ui:
    name: old-ui
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: No old UI outside the list (R0, both frontends)
        run: |
          git fetch --no-tags origin main
          node scripts/check_old_ui.mjs origin/main

  api:
    name: api
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: innovation
          POSTGRES_PASSWORD: innovation
          POSTGRES_DB: innovation_portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U innovation -d innovation_portal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      INNOVATION_PORTAL_POSTGRES_USER: innovation
      INNOVATION_PORTAL_POSTGRES_PASSWORD: innovation
      INNOVATION_PORTAL_POSTGRES_DB: innovation_portal
      INNOVATION_PORTAL_POSTGRES_HOST: localhost
      INNOVATION_PORTAL_POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        shell: bash
        working-directory: innovation_portal_api
    steps:
      - name: Start clock
        working-directory: .
        run: date +%s > "$RUNNER_TEMP/job-start"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: innovation_portal_api/requirements/*.txt

      - name: Install dependencies
        id: install
        run: |
          mkdir -p ../ci-out
          python -m pip install --upgrade pip 2>&1 | tee ../ci-out/install.txt
          pip install -r requirements/local.txt 2>&1 | tee -a ../ci-out/install.txt

      # Model changes already on main without a migration are listed in
      # tests/known_migration_drift.txt; anything else fails.
      - name: Migrations up to date
        id: migrations
        continue-on-error: true
        run: |
          set +e
          python manage.py makemigrations --check --dry-run 2>&1 | tee ../ci-out/migrations.txt
          code=${PIPESTATUS[0]}
          set -e
          python ../scripts/check_migrations.py ../ci-out/migrations.txt --exit-code "$code" \
            --known tests/known_migration_drift.txt --summary-json ../ci-out/migrations-summary.json

      - name: Run tests
        id: pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set +e
          date +%s > ../ci-out/pytest-start
          pytest -q -n auto --dist loadfile --create-db -p no:cacheprovider --junitxml=pytest-report.xml -rf --durations=15 2>&1 | tee ../ci-out/pytest-output.txt
          code=${PIPESTATUS[0]}
          date +%s > ../ci-out/pytest-end
          echo "pytest exit code: $code"
          # 1 means some tests failed; the next step decides whether they are new.
          if [ "$code" -gt 1 ]; then exit "$code"; fi

      - name: Compare with known failures on main
        id: results
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          python ../scripts/check_test_results.py pytest-report.xml
          --known tests/known_failures.txt
          --root .
          --summary-json ../ci-out/api-tests.json
          --details ../ci-out/api-new-failures.txt

      - name: Record step results
        if: ${{ always() }}
        run: |
          mkdir -p ../ci-out
          cp pytest-report.xml ../ci-out/ 2>/dev/null || true
          now=$(date +%s)
          job_seconds=$(( now - $(cat "$RUNNER_TEMP/job-start" 2>/dev/null || echo "$now") ))
          if [ -f ../ci-out/pytest-start ] && [ -f ../ci-out/pytest-end ]; then
            pytest_seconds=$(( $(cat ../ci-out/pytest-end) - $(cat ../ci-out/pytest-start) ))
          else
            pytest_seconds=null
          fi
          cat > ../ci-out/api-steps.json <<EOF
          {"install": "${{ steps.install.outcome }}", "migrations": "${{ steps.migrations.outcome }}", "pytest": "${{ steps.pytest.outcome }}", "results": "${{ steps.results.outcome }}", "pytest_seconds": $pytest_seconds, "job_seconds_to_here": $job_seconds}
          EOF

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: api-results
          path: ci-out/
          if-no-files-found: warn

      - name: Fail if migrations are missing
        if: ${{ steps.migrations.outcome == 'failure' }}
        run: |
          echo "makemigrations --check found model changes without a migration that are not known on main:"
          python ../scripts/check_migrations.py ../ci-out/migrations.txt --exit-code 1 --known tests/known_migration_drift.txt || true
          exit 1

  admin:
    name: admin
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: innovation_portal_admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: innovation_portal_admin/package-lock.json

      - name: Install dependencies
        id: install
        run: |
          mkdir -p ../ci-out
          npm ci 2>&1 | tee ../ci-out/install.txt

      - name: Lint (new problems vs baseline)
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set +e
          npm run lint -- --format json --output-file ../ci-out/admin-lint.json
          npx eslint . --ext js,jsx --report-unused-disable-directives > ../ci-out/admin-lint.txt 2>&1
          set -e
          python3 ../scripts/check_lint_baseline.py ../ci-out/admin-lint.json \
            --baseline lint-baseline.json --root . \
            --summary-json ../ci-out/admin-lint-summary.json

      - name: Tests
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test 2>&1 | tee ../ci-out/admin-test.txt

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build 2>&1 | tee ../ci-out/admin-build.txt

      - name: Record step results
        if: ${{ always() }}
        run: |
          mkdir -p ../ci-out
          cat > ../ci-out/admin-steps.json <<EOF
          {"install": "${{ steps.install.outcome }}", "lint": "${{ steps.lint.outcome }}", "test": "${{ steps.test.outcome }}", "build": "${{ steps.build.outcome }}"}
          EOF

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: admin-results
          path: ci-out/
          if-no-files-found: warn

  public:
    name: public
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: innovation_portal_public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: innovation_portal_public/package-lock.json

      - name: Install dependencies
        id: install
        run: |
          mkdir -p ../ci-out
          npm ci 2>&1 | tee ../ci-out/install.txt

      - name: Type check
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit 2>&1 | tee ../ci-out/public-typecheck.txt

      - name: Tests
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test 2>&1 | tee ../ci-out/public-test.txt

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build 2>&1 | tee ../ci-out/public-build.txt

      - name: Record step results
        if: ${{ always() }}
        run: |
          mkdir -p ../ci-out
          cat > ../ci-out/public-steps.json <<EOF
          {"install": "${{ steps.install.outcome }}", "typecheck": "${{ steps.typecheck.outcome }}", "test": "${{ steps.test.outcome }}", "build": "${{ steps.build.outcome }}"}
          EOF

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: public-results
          path: ci-out/
          if-no-files-found: warn

  # Writes one summary for the run and commits it to the `ci-results` branch
  # (results/<branch>/<sha>/) so agents without a GitHub API token can read the
  # outcome with `git fetch`. Branch and sha are the PR head's for pull_request
  # runs, so whichever of push/pull_request survives the concurrency group
  # publishes the result.
  # Skipped when the run was cancelled (superseded), so a cancelled run never
  # publishes a result.
  report:
    name: report
    needs: [api, admin, public, em-dash, old-ui]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Summarise
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          python3 scripts/ci_report.py
          --reports reports
          --out ci-summary
          --branch "$BRANCH"
          --sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --needs "$NEEDS_JSON"

      - name: Publish to the ci-results branch
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          dest="results/${BRANCH}/${HEAD_SHA}"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            rm -rf results-repo
            if git ls-remote --exit-code --heads "$url" ci-results >/dev/null 2>&1; then
              git clone --quiet --depth 1 --branch ci-results "$url" results-repo
            else
              git init --quiet -b ci-results results-repo
              git -C results-repo remote add origin "$url"
              printf '# CI results\n\nWritten by the report job in .github/workflows/ci.yml. One folder per pushed commit: results/<branch>/<sha>/summary.md. Never merge this branch.\n' > results-repo/README.md
            fi
            mkdir -p "results-repo/${dest}"
            cp -R ci-summary/. "results-repo/${dest}/"
            git -C results-repo add -A
            git -C results-repo commit --quiet -m "CI results: ${BRANCH} ${HEAD_SHA::7} (run ${GITHUB_RUN_ID}, ${GITHUB_EVENT_NAME})"
            if git -C results-repo push --quiet origin ci-results; then
              echo "Published to ci-results:${dest}"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Could not publish results after 5 attempts" >&2
          exit 1
